[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "printqueue"
version = "0.1.0"
description = "Dokumente sammeln, konvertieren und als gemeinsamen CUPS-Auftrag drucken"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
dependencies = [
  "PySide6>=6.7,<7",
  "Pillow>=10,<13",
  "pypdf>=5,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.9",
]

[project.scripts]
printqueue = "printqueue.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/printqueue"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
